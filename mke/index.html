<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKE Data Explorer</title>
  <style>
    /* ── CSS Custom Properties ── */
    :root {
      --primary: #0066ff;
      --primary-light: #3385ff;
      --primary-dark: #0044cc;
      --accent: #ff6b35;
      --accent-light: #ff8a5c;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.08);
      --shadow-xl: 0 20px 60px rgba(0,0,0,.15), 0 8px 20px rgba(0,0,0,.1);
      --transition: .25s cubic-bezier(.4,0,.2,1);
    }

    [data-theme="light"] {
      --bg: #f0f4f8;
      --bg-card: #ffffff;
      --bg-header: #1a1a2e;
      --bg-row-alt: #f8fafc;
      --bg-row-hover: #eef2ff;
      --bg-input: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-header: #ffffff;
      --border: #e2e8f0;
      --border-focus: var(--primary);
      --scrollbar-track: #f1f5f9;
      --scrollbar-thumb: #cbd5e1;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-header: #0f172a;
      --bg-row-alt: #1a2436;
      --bg-row-hover: #263044;
      --bg-input: #1e293b;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-header: #f1f5f9;
      --border: #334155;
      --border-focus: var(--primary-light);
      --scrollbar-track: #1e293b;
      --scrollbar-thumb: #475569;
    }

    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    /* ── Hero Section ── */
    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(0,102,255,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,107,53,.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(16,185,129,.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-content { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: .5rem;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 550px;
      margin: 0 auto;
    }

    /* ── Toolbar ── */
    .toolbar {
      max-width: 1400px;
      margin: -1.5rem auto 0;
      padding: 0 1.5rem;
      position: relative;
      z-index: 10;
    }

    .toolbar-inner {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      border: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }

    .search-wrap {
      flex: 1 1 280px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: .6rem .75rem .6rem 2.5rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: .925rem;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0,102,255,.15);
    }

    .search-input::placeholder { color: var(--text-secondary); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--bg-row-hover);
    }

    .btn:active { transform: scale(.97); }

    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #fff;
    }

    .stats {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-left: auto;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding: .35rem .7rem;
      background: var(--bg-row-alt);
      border-radius: 20px;
      transition: background var(--transition), color var(--transition);
    }

    .stat-badge .num {
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ── Table Container ── */
    .table-container {
      max-width: 1400px;
      margin: 1.5rem auto 3rem;
      padding: 0 1.5rem;
    }

    .table-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }

    thead th {
      background: var(--bg-header);
      color: var(--text-header);
      padding: .85rem 1rem;
      text-align: left;
      font-weight: 700;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      border-bottom: 2px solid rgba(255,255,255,.08);
      transition: background var(--transition);
      position: relative;
    }

    thead th:hover { background: rgba(255,255,255,.08); }

    thead th .sort-icon {
      display: inline-block;
      margin-left: .35rem;
      opacity: .4;
      font-size: .75rem;
      transition: opacity var(--transition), transform var(--transition);
      vertical-align: middle;
    }

    thead th.sorted .sort-icon { opacity: 1; }
    thead th.sorted.desc .sort-icon { transform: rotate(180deg); }

    tbody tr {
      transition: background var(--transition);
      border-bottom: 1px solid var(--border);
    }

    tbody tr:nth-child(even) { background: var(--bg-row-alt); }
    tbody tr:hover { background: var(--bg-row-hover); }

    tbody td {
      padding: .75rem 1rem;
      color: var(--text);
      transition: color var(--transition);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody td a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    tbody td a:hover { text-decoration: underline; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-btn:disabled { opacity: .4; cursor: not-allowed; }

    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .page-info {
      font-size: .85rem;
      color: var(--text-secondary);
      padding: 0 .5rem;
    }

    .per-page-select {
      padding: .35rem .5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text);
      font-size: .85rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    /* ── Loading State ── */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      gap: 1.25rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── Error State ── */
    .error-container {
      padding: 3rem 2rem;
      text-align: center;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--danger);
      margin-bottom: .5rem;
    }

    .error-message {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Empty State ── */
    .empty-state {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: .4; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-size: .8rem;
    }

    .footer a { color: var(--primary); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── Theme Toggle ── */
    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: rotate(15deg);
    }

    .theme-toggle svg { width: 18px; height: 18px; }

    /* ── Column Filter Dropdown ── */
    .filter-dropdown {
      position: relative;
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      padding: .75rem;
      z-index: 20;
      min-width: 200px;
      max-height: 320px;
      overflow-y: auto;
    }

    .filter-panel.show { display: block; }

    .filter-panel label {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .25rem;
      font-size: .85rem;
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      transition: background var(--transition);
    }

    .filter-panel label:hover { background: var(--bg-row-hover); }

    .filter-panel input[type="checkbox"] { accent-color: var(--primary); }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn .4s ease-out both; }

    tbody tr { animation: fadeIn .3s ease-out both; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero { padding: 2rem 1rem 1.5rem; }
      .toolbar, .table-container { padding: 0 .75rem; }
      .toolbar-inner { padding: .75rem; }
      .stats { margin-left: 0; width: 100%; justify-content: flex-start; }
      thead th, tbody td { padding: .6rem .7rem; font-size: .8rem; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 1.5rem; }
      .toolbar-inner { flex-direction: column; }
      .search-wrap { flex: 1 1 100%; }
    }

    /* ── Toast Notification ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-left: 4px solid var(--success);
      border-radius: var(--radius-sm);
      padding: .75rem 1.25rem;
      box-shadow: var(--shadow-lg);
      font-size: .9rem;
      font-weight: 500;
      z-index: 100;
      transform: translateX(120%);
      transition: transform .3s ease;
    }

    .toast.show { transform: translateX(0); }

    /* ── Highlight ── */
    mark {
      background: rgba(255,107,53,.25);
      color: inherit;
      padding: .05em .15em;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- Hero -->
  <header class="hero">
    <div class="hero-content fade-in">
      <h1>MKE Data Explorer</h1>
      <p>Interactive data dashboard — search, sort, filter, and explore with ease</p>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar fade-in">
    <div class="toolbar-inner">
      <!-- Search -->
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search across all columns…" aria-label="Search data">
      </div>

      <!-- Column Filter -->
      <div class="filter-dropdown">
        <button class="btn" id="filterBtn" aria-haspopup="true" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 4h18M7 9h10M10 14h4"/></svg>
          Columns
        </button>
        <div class="filter-panel" id="filterPanel" role="menu"></div>
      </div>

      <!-- Export CSV -->
      <button class="btn" id="exportBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Export CSV
      </button>

      <!-- Theme Toggle -->
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <!-- Stats -->
      <div class="stats">
        <span class="stat-badge">Showing <span class="num" id="visibleCount">0</span></span>
        <span class="stat-badge">Total <span class="num" id="totalCount">0</span></span>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-container fade-in">
    <div class="table-card">
      <div class="table-scroll" id="tableScroll">
        <!-- Loading -->
        <div class="loading-container" id="loadingState">
          <div class="spinner"></div>
          <div class="loading-text">Fetching data from Google Sheets…</div>
        </div>

        <!-- Error -->
        <div class="error-container" id="errorState" style="display:none">
          <div class="error-icon">⚠️</div>
          <div class="error-title">Unable to Load Data</div>
          <div class="error-message" id="errorMessage">Please check your connection and try again.</div>
          <button class="btn btn-primary" id="retryBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
            Retry
          </button>
        </div>

        <!-- Table (hidden until data loads) -->
        <table id="dataTable" style="display:none">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination" style="display:none"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="footer">
    <p>Data sourced from
      <a href="https://docs.google.com/spreadsheets/d/102GvNR1vAVTfFXUxbPB3IKQXwjkkOH5uMr3oNfoCEtc/htmlview" target="_blank" rel="noopener">Google Sheets</a>
      &middot; Built with ❤️
    </p>
  </footer>

  <script>
    (() => {
      'use strict';

      /* ── Configuration ── */
      const SHEET_ID = '102GvNR1vAVTfFXUxbPB3IKQXwjkkOH5uMr3oNfoCEtc';
      const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
      const DEFAULT_PAGE_SIZE = 25;

      /* ── State ── */
      let allRows = [];
      let headers = [];
      let filteredRows = [];
      let visibleCols = [];
      let sortCol = -1;
      let sortAsc = true;
      let currentPage = 1;
      let pageSize = DEFAULT_PAGE_SIZE;

      /* ── DOM References ── */
      const $ = (id) => document.getElementById(id);
      const searchInput   = $('searchInput');
      const tableHead     = $('tableHead');
      const tableBody     = $('tableBody');
      const dataTable     = $('dataTable');
      const loadingState  = $('loadingState');
      const errorState    = $('errorState');
      const errorMessage  = $('errorMessage');
      const retryBtn      = $('retryBtn');
      const pagination    = $('pagination');
      const filterBtn     = $('filterBtn');
      const filterPanel   = $('filterPanel');
      const exportBtn     = $('exportBtn');
      const themeToggle   = $('themeToggle');
      const sunIcon       = $('sunIcon');
      const moonIcon      = $('moonIcon');
      const visibleCount  = $('visibleCount');
      const totalCount    = $('totalCount');
      const toast         = $('toast');

      /* ── Theme ── */
      function initTheme() {
        const saved = localStorage.getItem('mke-theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        updateThemeIcons();
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('mke-theme', next);
        updateThemeIcons();
      }

      function updateThemeIcons() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        sunIcon.style.display = isDark ? 'none' : 'block';
        moonIcon.style.display = isDark ? 'block' : 'none';
      }

      /* ── Toast ── */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      /* ── Data Fetching ── */
      function fetchData() {
        loadingState.style.display = '';
        errorState.style.display = 'none';
        dataTable.style.display = 'none';
        pagination.style.display = 'none';

        const callbackName = 'gvizCallback_' + Date.now();
        const script = document.createElement('script');
        script.src = SHEET_URL + '&tq=&callback=' + callbackName;

        let resolved = false;
        const timeout = setTimeout(() => {
          if (!resolved) {
            resolved = true;
            cleanup();
            tryFetchCSV();
          }
        }, 10000);

        window[callbackName] = function(response) {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          cleanup();

          if (!response || !response.table) {
            showError('Received invalid data from Google Sheets.');
            return;
          }

          parseGvizResponse(response.table);
        };

        script.onerror = function() {
          if (resolved) return;
          resolved = true;
          clearTimeout(timeout);
          cleanup();
          tryFetchCSV();
        };

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        document.body.appendChild(script);
      }

      /* Fallback: fetch CSV */
      function tryFetchCSV() {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        fetch(csvUrl)
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(csv => parseCSV(csv))
          .catch(() => {
            showError('Could not load data. The spreadsheet may not be publicly shared, or you may be offline.');
          });
      }

      function parseGvizResponse(table) {
        headers = table.cols.map(c => c.label || c.id || '');
        allRows = table.rows.map(r =>
          r.c.map(cell => {
            if (!cell) return '';
            if (cell.f) return cell.f;
            return cell.v != null ? String(cell.v) : '';
          })
        );
        onDataLoaded();
      }

      function parseCSV(csv) {
        const lines = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < csv.length; i++) {
          const ch = csv[i];
          if (ch === '"') {
            if (inQuotes && csv[i + 1] === '"') { current += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (ch === ',' && !inQuotes) {
            lines.push(current); current = '';
          } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
            lines.push(current); current = '';
            if (ch === '\r' && csv[i + 1] === '\n') i++;
            lines.push(null); // row separator
          } else {
            current += ch;
          }
        }
        if (current) lines.push(current);

        const rows = [];
        let row = [];
        for (const val of lines) {
          if (val === null) { if (row.length > 0) rows.push(row); row = []; }
          else { row.push(val); }
        }
        if (row.length > 0) rows.push(row);

        if (rows.length === 0) {
          showError('The spreadsheet appears to be empty.');
          return;
        }

        headers = rows[0];
        allRows = rows.slice(1);
        onDataLoaded();
      }

      function onDataLoaded() {
        // Filter out completely empty rows
        allRows = allRows.filter(r => r.some(cell => cell.trim() !== ''));

        // Filter out empty header columns
        const nonEmptyColIndexes = [];
        for (let i = 0; i < headers.length; i++) {
          if (headers[i].trim() !== '') nonEmptyColIndexes.push(i);
        }
        if (nonEmptyColIndexes.length < headers.length) {
          headers = nonEmptyColIndexes.map(i => headers[i]);
          allRows = allRows.map(r => nonEmptyColIndexes.map(i => r[i] || ''));
        }

        visibleCols = headers.map((_, i) => i);
        totalCount.textContent = allRows.length;
        buildColumnFilters();
        applyFilters();

        loadingState.style.display = 'none';
        dataTable.style.display = '';
        pagination.style.display = '';
      }

      function showError(msg) {
        loadingState.style.display = 'none';
        errorState.style.display = '';
        errorMessage.textContent = msg;
      }

      /* ── Column Filters ── */
      function buildColumnFilters() {
        filterPanel.innerHTML = '';
        headers.forEach((h, i) => {
          const label = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = true;
          cb.dataset.col = i;
          cb.addEventListener('change', () => {
            if (cb.checked) {
              if (!visibleCols.includes(i)) visibleCols.push(i);
              visibleCols.sort((a, b) => a - b);
            } else {
              visibleCols = visibleCols.filter(c => c !== i);
            }
            renderTable();
          });
          label.appendChild(cb);
          label.appendChild(document.createTextNode(' ' + h));
          filterPanel.appendChild(label);
        });
      }

      /* ── Search & Filter ── */
      let searchTimeout;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          currentPage = 1;
          applyFilters();
        }, 200);
      });

      function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) {
          filteredRows = [...allRows];
        } else {
          filteredRows = allRows.filter(row =>
            row.some(cell => cell.toLowerCase().includes(query))
          );
        }
        if (sortCol >= 0) applySorting();
        visibleCount.textContent = filteredRows.length;
        renderTable();
        renderPagination();
      }

      /* ── Sorting ── */
      function handleSort(colIndex) {
        if (sortCol === colIndex) {
          sortAsc = !sortAsc;
        } else {
          sortCol = colIndex;
          sortAsc = true;
        }
        applySorting();
        renderTable();
        renderPagination();
      }

      function applySorting() {
        const col = sortCol;
        filteredRows.sort((a, b) => {
          let va = a[col] || '';
          let vb = b[col] || '';
          // Try numeric comparison
          const na = parseFloat(va.replace(/[^0-9.\-]/g, ''));
          const nb = parseFloat(vb.replace(/[^0-9.\-]/g, ''));
          if (!isNaN(na) && !isNaN(nb)) {
            return sortAsc ? na - nb : nb - na;
          }
          // String comparison
          va = va.toLowerCase();
          vb = vb.toLowerCase();
          if (va < vb) return sortAsc ? -1 : 1;
          if (va > vb) return sortAsc ? 1 : -1;
          return 0;
        });
      }

      /* ── Rendering ── */
      function renderTable() {
        const query = searchInput.value.trim().toLowerCase();

        // Header
        tableHead.innerHTML = '';
        const headerRow = document.createElement('tr');
        visibleCols.forEach(colIdx => {
          const th = document.createElement('th');
          th.textContent = headers[colIdx];
          const sortSpan = document.createElement('span');
          sortSpan.className = 'sort-icon';
          sortSpan.textContent = '▲';
          th.appendChild(sortSpan);

          if (sortCol === colIdx) {
            th.classList.add('sorted');
            if (!sortAsc) th.classList.add('desc');
          }

          th.addEventListener('click', () => handleSort(colIdx));
          headerRow.appendChild(th);
        });
        tableHead.appendChild(headerRow);

        // Body
        tableBody.innerHTML = '';
        const start = (currentPage - 1) * pageSize;
        const pageRows = filteredRows.slice(start, start + pageSize);

        if (pageRows.length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = visibleCols.length;
          td.className = 'empty-state';
          td.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><p>No matching records found</p>';
          tr.appendChild(td);
          tableBody.appendChild(tr);
          return;
        }

        pageRows.forEach((row, rIdx) => {
          const tr = document.createElement('tr');
          tr.style.animationDelay = (rIdx * 0.02) + 's';
          visibleCols.forEach(colIdx => {
            const td = document.createElement('td');
            let value = row[colIdx] || '';

            // Auto-detect URLs and make them clickable
            if (/^https?:\/\//i.test(value.trim())) {
              const a = document.createElement('a');
              a.href = value.trim();
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = value.trim().length > 50 ? value.trim().substring(0, 50) + '…' : value.trim();
              td.appendChild(a);
            } else if (query && value.toLowerCase().includes(query)) {
              // Highlight search matches
              td.innerHTML = highlightText(value, query);
            } else {
              td.textContent = value;
            }

            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });
      }

      function highlightText(text, query) {
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
      }

      /* ── Pagination ── */
      function renderPagination() {
        pagination.innerHTML = '';
        const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));

        // Rows per page selector
        const label = document.createElement('span');
        label.className = 'page-info';
        label.textContent = 'Rows: ';
        const select = document.createElement('select');
        select.className = 'per-page-select';
        select.setAttribute('aria-label', 'Rows per page');
        [10, 25, 50, 100].forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          if (n === pageSize) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener('change', () => {
          pageSize = parseInt(select.value, 10);
          currentPage = 1;
          renderTable();
          renderPagination();
        });
        pagination.appendChild(label);
        pagination.appendChild(select);

        // Spacer
        const spacer = document.createElement('span');
        spacer.style.flex = '1';
        pagination.appendChild(spacer);

        // Page info
        const info = document.createElement('span');
        info.className = 'page-info';
        const startRow = (currentPage - 1) * pageSize + 1;
        const endRow = Math.min(currentPage * pageSize, filteredRows.length);
        info.textContent = `${startRow}–${endRow} of ${filteredRows.length}`;
        pagination.appendChild(info);

        // Prev button
        addPageButton('‹', currentPage > 1, () => { currentPage--; renderTable(); renderPagination(); });

        // Page buttons (with ellipsis)
        const maxVisible = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        if (endPage - startPage < maxVisible - 1) {
          startPage = Math.max(1, endPage - maxVisible + 1);
        }

        if (startPage > 1) {
          addPageButton('1', true, () => { currentPage = 1; renderTable(); renderPagination(); });
          if (startPage > 2) {
            const ellipsis = document.createElement('span');
            ellipsis.className = 'page-info';
            ellipsis.textContent = '…';
            pagination.appendChild(ellipsis);
          }
        }

        for (let p = startPage; p <= endPage; p++) {
          addPageButton(String(p), true, () => { currentPage = p; renderTable(); renderPagination(); }, p === currentPage);
        }

        if (endPage < totalPages) {
          if (endPage < totalPages - 1) {
            const ellipsis = document.createElement('span');
            ellipsis.className = 'page-info';
            ellipsis.textContent = '…';
            pagination.appendChild(ellipsis);
          }
          addPageButton(String(totalPages), true, () => { currentPage = totalPages; renderTable(); renderPagination(); });
        }

        // Next button
        addPageButton('›', currentPage < totalPages, () => { currentPage++; renderTable(); renderPagination(); });
      }

      function addPageButton(label, enabled, handler, active) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (active ? ' active' : '');
        btn.textContent = label;
        btn.disabled = !enabled;
        if (enabled) btn.addEventListener('click', handler);
        pagination.appendChild(btn);
      }

      /* ── Export CSV ── */
      exportBtn.addEventListener('click', () => {
        if (filteredRows.length === 0) return;
        const visHeaders = visibleCols.map(i => headers[i]);
        const csvRows = [visHeaders.map(escCSV).join(',')];
        filteredRows.forEach(row => {
          csvRows.push(visibleCols.map(i => escCSV(row[i] || '')).join(','));
        });
        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'mke-data-export.csv';
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('CSV exported successfully!');
      });

      function escCSV(val) {
        if (/[",\n\r]/.test(val)) return '"' + val.replace(/"/g, '""') + '"';
        return val;
      }

      /* ── Filter Panel Toggle ── */
      filterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = filterPanel.classList.toggle('show');
        filterBtn.setAttribute('aria-expanded', isOpen);
      });

      document.addEventListener('click', (e) => {
        if (!filterPanel.contains(e.target) && e.target !== filterBtn) {
          filterPanel.classList.remove('show');
          filterBtn.setAttribute('aria-expanded', 'false');
        }
      });

      /* ── Keyboard Navigation ── */
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchInput.value = '';
          currentPage = 1;
          applyFilters();
        }
      });

      /* ── Theme Toggle ── */
      themeToggle.addEventListener('click', toggleTheme);

      /* ── Retry ── */
      retryBtn.addEventListener('click', fetchData);

      /* ── Init ── */
      initTheme();
      fetchData();
    })();
  </script>
</body>
</html>
